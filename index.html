<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet">
    <title>roncamotors</title>
    <script>
      // Antes del primer pintado, para no parpadear en oscuro al abrir en claro.
      (function () {
        try {
          var m = JSON.parse(localStorage.getItem('roncamotors_theme') || '"system"')
          var t = m === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
        } catch (e) { /* sin localStorage: se queda en oscuro */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
